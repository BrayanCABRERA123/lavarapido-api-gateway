# Compila y corre las pruebas en cada push o pull request a develop/main.
# No necesita base de datos: las pruebas usan dobles y contextos web sin SQL Server.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # en Windows el wrapper se sube sin permiso de ejecución
      - run: chmod +x mvnw

      - name: Pruebas
        run: ./mvnw -B -ntp verify

      - name: Reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # CD: cuando un cambio entra a main (PR aprobado) y el CI pasa, pide el despliegue en Azure al
  # workflow "Desplegar en Azure" de lavarapido-infra. Necesita el secreto DEPLOY_DISPATCH_TOKEN
  # (token fine-grained con acceso solo a lavarapido-infra y permiso Actions: Read and write).
  deploy:
    name: Pedir despliegue
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Avisar a lavarapido-infra
        env:
          TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          SOURCE: ${{ github.repository }}@${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta el secreto DEPLOY_DISPATCH_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/BrayanCABRERA123/lavarapido-infra/actions/workflows/deploy.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"automatic\":\"true\",\"source\":\"$SOURCE\"}}"
          echo "Despliegue pedido: lavarapido-infra → Actions → Desplegar en Azure"
